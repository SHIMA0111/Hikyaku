[workspace]
resolver = "3"
members = [
    "hikyaku",
    "hikyaku-aws",
    "hikyaku-azure",
    "hikyaku-core",
    "hikyaku-gcp", "hikyaku-googledrive", 
    "hikyaku-legacy",
]

[workspace.package]
version = "0.0.1"

[workspace.dependencies]
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "2"
